<script>
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

    const ph=W()<=600;/* phones: the centre flowers are drawn a little bigger */
    for(let k=0;k<8;k++)push('eshbal-flower',S*(ph?.68:.62),k*Math.PI/4+Math.PI/8,S*(ph?.74:.6),0);
    let r=S*1.6,j=1;/* equal air between rings: each ring sits a fixed gap beyond the outer edge of the one before it, whatever the icon sizes */const edge0=S*(W()<=600?1.42:1.22),GAP=S*.2;let edge=edge0;
